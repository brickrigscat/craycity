<div id="cray-players" style="
  display:inline-flex;

">
  <span>Players Online</span>
  <strong id="cray-count">...</strong>

<script>
async function updateCount() {
  try {
    const r = await fetch(
      "https://api.mcstatus.io/v2/status/java/craycity.minekeep.gg"
    );
    if (!r.ok) throw new Error();
    const data = await r.json();
    document.getElementById("cray-count").textContent =
      data.online ? data.players.online : "0";
  } catch {
    document.getElementById("cray-count").textContent = "?";
  }
}
updateCount();
setInterval(updateCount, 60000);
</script>

<div style="
  display:inline-block;
  background:#1c2333;
  color:white;
  padding:18px;
  border:1px solid #394355;
  border-radius:16px;
  font-family:Arial,sans-serif;
  min-width:220px;
">
  <div>Players Online: <b id="cray-count">...</b></div>
  <div id="cray-names" style="margin-top:10px;font-size:14px">
    Checking players...
  </div>
</div>

<script>
async function updatePlayers() {
  const count = document.getElementById("cray-count");
  const names = document.getElementById("cray-names");

  try {
    const response = await fetch(
      "https://api.mcstatus.io/v2/status/java/craycity.minekeep.gg"
    );

    if (!response.ok) throw new Error("API error");

    const data = await response.json();

    if (!data.online) {
      count.textContent = "0";
      names.textContent = "Server offline";
      return;
    }

    count.textContent = data.players.online;

    const players = data.players.list || [];

    if (players.length > 0) {
      names.replaceChildren();
      players.forEach(player => {
        const row = document.createElement("div");
        row.textContent = "• " + player.name_clean;
        names.appendChild(row);
      });
    } else {
      names.textContent = data.players.online === 0
        ? "No players online"
        : "Player names unavailable";
    }
  } catch {
    count.textContent = "?";
    names.textContent = "Unable to check server";
  }
}

updatePlayers();
setInterval(updatePlayers, 10000);
</script>
